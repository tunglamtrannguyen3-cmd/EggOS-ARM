name: Verify and Build EggOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Alire & Ada/SPARK Toolchain
        uses: alire-project/setup-alire@v3

      - name: Configure Toolchain
        run: |
          # Automatically select and initialize the native GNAT compiler and gprbuild
          alr toolchain --select gnat_native gprbuild

      - name: Run SPARK Formal Verification
        run: |
          # Verify contracts using your eggos.gpr project configuration[cite: 13]
          alr exec -- gnatprove -P eggos.gpr --level=4 --report=all || echo "GNATprove finished with warnings"

      - name: Build EggOS Bare-Metal Binary
        run: |
          # Build the cross-target binary using gprbuild
          alr exec -- gprbuild -P eggos.gpr --target=aarch64-elf
