name: Verify and Build EggOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Native GNAT (for gprbuild)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild

      - name: Download and Setup ARM64 Bare-Metal Toolchain (aarch64-none-elf)
        run: |
          # Download the official ARM GNU Toolchain for AArch64 bare-metal
          TOOLCHAIN_URL="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf.tar.xz"
          wget -q $TOOLCHAIN_URL -O toolchain.tar.xz
          tar -xf toolchain.tar.xz
          
          # Move it to a clean directory and add to PATH
          sudo mv arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-elf /opt/aarch64-none-elf
          echo "/opt/aarch64-none-elf/bin" >> $GITHUB_PATH

      - name: Build EggOS Bare-Metal Binary
        run: |
          # Use the true bare-metal target
          gprbuild -P eggos.gpr --target=aarch64-none-elf
