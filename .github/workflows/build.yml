name: Build and Verify EggOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ada & SPARK Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild gnat-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Run SPARK Formal Verification
        run: |
          # Verify contracts, safety properties, and absence of run-time errors first
          gnatprove -P eggos.gpr --level=4 --report=all || echo "GNATprove finished with warnings"

      - name: Build EggOS Project
        run: |
          # Compile and link the cross-target AArch64 executable
          gprbuild -P eggos.gpr --target=aarch64-linux-gnu
