name: Verify and Build EggOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Alire & Ada/SPARK Toolchain
        uses: alire-project/setup-alire@v3

      - name: Run SPARK Formal Verification
        run: |
          # Alire provides gnatprove automatically
          gnatprove -P eggos.gpr --level=4 --report=all || echo "GNATprove finished with warnings"

      - name: Build EggOS Bare-Metal Binary
        run: |
          gprbuild -P eggos.gpr --target=aarch64-elf
