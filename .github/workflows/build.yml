name: Verify EggOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Alire & Ada/SPARK Toolchain
        uses: alire-project/setup-alire@v3

      - name: Configure Toolchain
        run: |
          alr toolchain --select gnat_native gprbuild

      - name: Run SPARK Formal Verification
        run: |
          alr exec -- gnatprove -P eggos.gpr --level=4 --report=all || {
            echo "--- GNATPROVE FAILED. PRINTING REPORT ---"
            if [ -f "gnatprove/gnatprove.out" ]; then
              cat gnatprove/gnatprove.out
            fi
            exit 1
          }

      - name: Build EggOS Binary (Native Test)
        run: |
          alr exec -- gprbuild -P eggos.gpr
